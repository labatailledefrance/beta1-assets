# Manifeste des assets tiers de la beta 1.
#
# Un `[[asset]]` est une œuvre : l'unité d'attribution (une ligne de
# ATTRIBUTIONS.md et de l'écran de crédits). Ses `[[asset.fichier]]` sont les
# fichiers à télécharger, rangés sous `<racine>/<id>/<nom>`.
#
# Le manifeste joue le rôle d'un lockfile : un fichier n'est accepté que si sa
# taille et son SHA-256 sont ceux d'ici. Ajouter ou mettre à jour un asset est
# un changement relu en PR, comme une dépendance ; `cargo test` vérifie les
# licences (CC0-1.0, CC-BY-4.0, OFL-1.1), les hôtes et que ATTRIBUTIONS.md
# est à jour (`cargo run -- attributions --ecrire`).
#
# Champs d'un fichier : `url` (HTTPS, hôtes connus) ou `sketchfab` (uid du
# modèle, téléchargé par l'API avec le jeton SKETCHFAB_TOKEN, licence
# revérifiée sur Sketchfab avant chaque téléchargement) ; `extraire` : entrées
# d'une archive zip à extraire à côté d'elle (sous leur seul nom de fichier).

